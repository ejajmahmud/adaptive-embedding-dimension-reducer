[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-embedding-dimension-reducer"
version = "0.1.0"
description = "Matryoshka-aware truncation and PCA dimensionality reduction for low-latency in-memory vector search"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
adaptive-embedding-dimension-reducer = "adaptive_embedding_dimension_reducer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_embedding_dimension_reducer*"]
